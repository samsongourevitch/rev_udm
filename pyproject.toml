[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revisited_udm"
version = "0.1.0"
description = "Backbone for discrete diffusion experiments"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "datasets==2.15.0",
    "einops==0.7.0",
    "fsspec",
    "git-lfs==1.6",
    "h5py==3.10.0",
    "hydra-core==1.3.2",
    "ipdb==0.13.13",
    "lightning",
    "notebook==7.1.1",
    "nvitop==1.3.2",
    "omegaconf==2.3.0",
    "packaging==23.2",
    "pandas==2.2.1",
    "rich==13.7.1",
    "seaborn==0.13.2",
    "scikit-learn==1.4.0",
    "mauve-text",
    "transformers==4.38.2",
    "wandb",
    "timm",
    "ocifs",
    "hf_transfer",
    "huggingface-hub",
]

